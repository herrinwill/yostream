# YoStream media server
# OBS publishes to rtmp://localhost:1935/live  (server rtmp://localhost:1935, key live)
# HLS preview: http://localhost:8888/live/index.m3u8
# Do not put stream keys in git. Add them under paths.live.forward locally.

logLevel: info
logDestinations: [stdout]

api: yes
apiAddress: :9997

playback: yes
playbackAddress: :9996

rtmp: yes
rtmpAddress: :1935

rtsp: yes
rtspAddress: :8554

hls: yes
hlsAddress: :8888
hlsAlwaysRemux: yes
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms

webrtc: yes
webrtcAddress: :8889
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302
webrtcICEUDPMuxAddress: :8189

pathDefaults:
  record: no
  recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  recordFormat: fmp4
  recordPartDuration: 1s
  recordSegmentDuration: 1h
  recordDeleteAfter: 0s
  overridePublisher: yes

paths:
  live:
    record: yes
    # Uncomment and paste real keys:
    # forward:
    #   - dest: rtmps://a.rtmps.youtube.com:443/live2#YOUR_YT_KEY
    #   - dest: rtmp://live.twitch.tv/app#YOUR_TWITCH_KEY
